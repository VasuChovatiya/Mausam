name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # No Local.xcconfig here, so the app builds for Open-Meteo without signing, and the UI tests run
      # on the offline demo transport.
      - name: Pick an iPhone simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iPhone simulator" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "DESTINATION=id=$udid" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Mausam.xcodeproj -scheme Mausam \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData

      - name: Unit tests
        run: |
          xcodebuild test-without-building \
            -project Mausam.xcodeproj -scheme Mausam \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:MausamTests

      - name: UI smoke tests
        run: |
          xcodebuild test-without-building \
            -project Mausam.xcodeproj -scheme Mausam \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:MausamUITests/MausamUITests \
            -parallel-testing-enabled NO
